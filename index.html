<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TryOn Live — Kundan</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: min(900px, 92%);
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      max-width: 650px;
      height: 55px;
      padding: 0 18px;
      border-radius: 15px;
      border: none;
      outline: none;
      font-size: 15px;
      margin-bottom: 12px;
    }

    button {
      height: 55px;
      padding: 0 30px;
      border: none;
      border-radius: 15px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-2px);
    }

    #cameraBox {
      display: none;
      margin-top: 30px;
      position: relative;
      width: 100%;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 25px;
      overflow: hidden;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      transform: scaleX(-1);
    }

    .live {
      position: absolute;
      top: 15px;
      left: 15px;
      background: red;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .product {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      background: white;
      color: black;
      width: 140px;
      height: 140px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #status {
      margin-top: 20px;
      color: #aaa;
    }

    .credit {
      margin-top: 40px;
      font-size: 12px;
      color: #666;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>
      TRYON LIVE
    </h1>

    <p>
      Created by Kundan
    </p>

    <input
      id="productUrl"
      type="url"
      placeholder="Paste any product link here"
    >

    <br>

    <button onclick="startCamera()">
      START TRY-ON
    </button>


    <div id="status">
      Camera has not started yet.
    </div>


    <div id="cameraBox">

      <video
        id="camera"
        autoplay
        playsinline
        muted
      ></video>

      <div class="live">
        ● LIVE
      </div>

      <div class="product">
        🕶️
      </div>

    </div>


    <div class="credit">
      Concept & Experience by Kundan · Inspired by DailyObjects.com
    </div>

  </div>


  <script>

    async function startCamera() {

      const status =
        document.getElementById("status");

      const cameraBox =
        document.getElementById("cameraBox");

      const video =
        document.getElementById("camera");


      status.innerText =
        "Requesting camera permission...";


      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: true,

            audio: false

          });


        video.srcObject =
          stream;


        cameraBox.style.display =
          "block";


        status.innerText =
          "Camera is working! 🎉";


      }

      catch (error) {

        console.error(error);


        status.innerText =
          "Camera could not be opened.";


        alert(
          "Camera permission was denied or the browser could not access your camera."
        );

      }

    }

  </script>


</body>

</html>
